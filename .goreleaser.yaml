version: 2

project_name: square-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: square-cli
    main: ./cmd/square-cli
    binary: square-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/MikeJansen/square-cli/internal/cli.version={{.Version}}
      - -X github.com/MikeJansen/square-cli/internal/cli.commit={{.ShortCommit}}
      - -X github.com/MikeJansen/square-cli/internal/cli.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
