name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify generated code is up to date
        run: |
          go run ./internal/codegen
          gofmt -w internal/commands pkg/square
          if ! git diff --quiet; then
            echo "Generated code is out of date. Run 'make generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
